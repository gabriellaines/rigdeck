# Validations for every change. Also called by release.yml before publishing.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]   # oldest supported and newest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt for the QML check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 >/dev/null
          pip install --quiet PySide6
      - run: scripts/check.sh
        env:
          RIGDECK_REQUIRE_QML: "1"

  # A pull request into main is a release: say which version merging it publishes.
  release-preview:
    name: Release preview
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          v=$(scripts/version.sh)
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::notice::Merging this publishes a $(scripts/release-level.sh) release after v$v (version bumped automatically)"
          else
            echo "::notice::Merging this publishes v$v"
          fi

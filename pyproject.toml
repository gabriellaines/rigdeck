[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rigdeck"
dynamic = ["version"]
description = "Control panel for PC hardware on Linux — AIO coolers, GPUs and system monitoring"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []  # core/CLI is pure standard library

[project.optional-dependencies]
# Prefer your distro's PySide6 package; see README.
gui = ["PySide6>=6.5"]

[project.scripts]
rigdeck = "rigdeck.cli:main"

[project.gui-scripts]
rigdeck-gui = "rigdeck.gui:main"

[tool.setuptools.dynamic]
version = { attr = "rigdeck.__version__" }

[tool.setuptools.packages.find]
include = ["rigdeck*"]

[tool.setuptools.package-data]
"rigdeck.gui" = ["icons/*.svg", "icons/LICENSE-lucide.txt", "qml/*.qml", "qml/pages/*.qml",
                 "qml/RigDeck/*.qml", "qml/RigDeck/qmldir"]
"rigdeck.modules.waterforce" = ["qml/*.qml"]
"rigdeck.modules.gpu" = ["qml/*.qml"]
